[package]
name = "project_on_core"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["rayon"] }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["loadable_extension", "functions"] }
# Le texte (pliage sans accents) : le même code que la 3.0.
po-text = { path = "../../project-on-rs/crates/po-text" }

[lib]
name = "project_on_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
