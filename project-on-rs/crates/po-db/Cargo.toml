[package]
name = "po-db"
description = "Project-On : la base SQLite (Bible, cantiques, prédications, livres, playlists, déroulé, médias) — même schéma que la 2.x"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
po-core = { path = "../po-core" }
po-text.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1.26"
# SQLite intégré (FTS5 compris) : pas de dépendance à la version installée sur le poste.
rusqlite = { version = "0.41.1", features = ["bundled", "functions", "backup"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
