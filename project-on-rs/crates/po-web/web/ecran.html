<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project-On — écran</title>
  <link rel="stylesheet" href="/polices.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    #stage { position: fixed; inset: 0; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .25s ease; }
    .layer.visible { opacity: 1; }
    /* Hors ligne : la dernière image reste ; seul un point discret dans le coin le signale. */
    #offline { position: fixed; top: 6px; left: 6px; width: 6px; height: 6px; border-radius: 50%;
               background: #f5b73b; opacity: 0; transition: opacity .3s; }
    body.offline #offline { opacity: .8; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="offline" title="Connexion à Project-On perdue : nouvelle tentative…"></div>
  <script src="/ecran.js"></script>
</body>
</html>
