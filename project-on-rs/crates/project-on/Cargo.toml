[package]
name = "project-on"
description = "Project-On : l'application (régie, bibliothèque, aperçu / direct, projection)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "project-on"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
po-core = { path = "../po-core" }
po-db.workspace = true
po-design.workspace = true
po-settings = { path = "../po-settings" }
po-layout.workspace = true
po-program.workspace = true
po-text.workspace = true
po-render.workspace = true
po-web.workspace = true
po-ndi.workspace = true
po-ui.workspace = true
po-search.workspace = true
po-pdf = { path = "../po-pdf" }
egui.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "links"] }
resvg = { version = "0.48.1", default-features = false }
tiny-skia.workspace = true
serde_json.workspace = true
serde.workspace = true
zip = { version = "9.5", default-features = false, features = ["deflate"] }
sha2 = "0.11"
rfd = "0.18"
cpal = "0.18.2"
regex = "1"
tungstenite = "0.30"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_WinRT", "Data_Pdf", "Storage", "Storage_Streams", "Foundation"] }

[features]
# La bascule (phase 8) : la 3.0 remplace la 2.x. Elle travaille directement sur les données de la
# 2.x (%APPDATA%\Project-On), sert les écrans Web sur le port 8080 de la 2.x et prend son verrou
# d'instance unique (l'installateur attend qu'elle soit fermée).
bascule = []

[dev-dependencies]
pollster = "0.4"
egui_kittest.workspace = true
image.workspace = true
tempfile = "3"

[lints]
workspace = true
