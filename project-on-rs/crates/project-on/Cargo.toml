[package]
name = "project-on"
description = "Project-On : l'application (régie, bibliothèque, aperçu / direct, projection)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "project-on"
path = "src/main.rs"

[dependencies]
po-core = { path = "../po-core" }
po-db.workspace = true
po-design.workspace = true
po-settings = { path = "../po-settings" }
po-layout.workspace = true
po-program.workspace = true
po-text.workspace = true
po-render.workspace = true
po-web.workspace = true
egui.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
resvg = { version = "0.48.1", default-features = false }
tiny-skia.workspace = true
serde_json.workspace = true
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[dev-dependencies]
pollster = "0.4"
egui_kittest.workspace = true
image.workspace = true
tempfile = "3"

[lints]
workspace = true
