[package]
name = "po-mesures"
description = "Project-On : les mesures des phases 0 et 1 (base, recherche à froid, trigrammes, mise en page, rendu, Web, interface) — jamais livré"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
po-db.workspace = true
po-design.workspace = true
po-settings = { path = "../po-settings" }
po-program = { path = "../po-program" }
tiny-skia.workspace = true
po-text.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
po-layout.workspace = true
po-render.workspace = true
po-web.workspace = true
project-on.workspace = true
egui.workspace = true
egui_kittest.workspace = true
image.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[lints]
workspace = true

[features]
# Les captures du site : l'interface de la version définitive (« 3.0 », pas « bêta »). Seulement
# avec `-p po-mesures --features site` : la fonctionnalité ne doit pas gagner les essais.
site = ["project-on/bascule"]
